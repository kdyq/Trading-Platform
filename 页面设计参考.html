  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

      color: var(--market-ink);
      font-family: &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, system-ui, sans-serif;
      width: 100%;
      container-type: inline-size;
    }

    #campus-market-concept * { box-sizing: border-box; }
    #campus-market-concept button,
    #campus-market-concept input { font: inherit; }

    #campus-market-concept .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    #campus-market-concept .market-shell {
      overflow: hidden;
      border: 1px solid var(--market-line);
      border-radius: 18px;
      background: var(--market-page);
      box-shadow: 0 20px 55px var(--market-shadow);
    }

    #campus-market-concept .market-nav {
      min-height: 68px;
      display: grid;
      grid-template-columns: auto minmax(180px, 1fr) auto;
      align-items: center;
      gap: 24px;
      padding: 0 28px;
      background: var(--market-surface);
      border-bottom: 1px solid var(--market-line);
    }

    #campus-market-concept .market-brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      border: 0;
      background: transparent;
      color: var(--market-ink);
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }

    #campus-market-concept .brand-mark {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 9px 9px 9px 2px;
      background: var(--market-accent);
      color: var(--market-accent-ink);
      transform: rotate(-4deg);
    }

    #campus-market-concept .market-search {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid var(--market-line);
      border-radius: 12px;
      background: var(--market-page);
      color: var(--market-muted);
    }
    #campus-market-concept .market-search input {
      min-width: 0;
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--market-ink);
    }
    #campus-market-concept .market-search input::placeholder { color: var(--market-muted); }

    #campus-market-concept .nav-actions { display: flex; align-items: center; gap: 10px; }
    #campus-market-concept .icon-action,
    #campus-market-concept .primary-action,
    #campus-market-concept .secondary-action,
    #campus-market-concept .back-action {
      border: 0;
      cursor: pointer;
      white-space: nowrap;
    }
    #campus-market-concept button:disabled {
      cursor: not-allowed;
      opacity: 0.58;
      filter: saturate(0.72);
    }
    #campus-market-concept .icon-action {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: transparent;
      color: var(--market-ink);
    }
    #campus-market-concept .primary-action {
      min-height: 40px;
      padding: 0 17px;
      border-radius: 12px;
      background: var(--market-accent);
      color: var(--market-accent-ink);
      font-weight: 500;
    }
    #campus-market-concept .secondary-action,
    #campus-market-concept .back-action {
      min-height: 40px;
      padding: 0 15px;
      border-radius: 12px;
      background: var(--market-surface);
      color: var(--market-ink);

  &lt;script src=&quot;https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js&quot;&gt;&lt;/script&gt;
  &lt;script src=&quot;https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js&quot;&gt;&lt;/script&gt;
  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&quot;campus-market-concept&quot;);
      if (!root) return;

      const shell = root.querySelector(&quot;.market-shell&quot;);
      const home = root.querySelector(&quot;.home-view&quot;);
      const detail = root.querySelector(&quot;.detail-view&quot;);
      const cards = Array.from(root.querySelectorAll(&quot;.product-card&quot;));
      const reduceMotion = window.matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;).matches;
      const speed = reduceMotion ? 0 : 1;

      const showDetail = () =&gt; {
        if (!window.gsap || reduceMotion) {
          home.style.display = &quot;none&quot;;
          detail.style.display = &quot;grid&quot;;
          return;
        }
        gsap.timeline({ defaults: { ease: &quot;power2.out&quot; } })
          .to(home, { autoAlpha: 0, y: 12, duration: 0.2 })
          .set(home, { display: &quot;none&quot; })
          .set(detail, { display: &quot;grid&quot;, autoAlpha: 0, y: 16 })
          .to(detail, { autoAlpha: 1, y: 0, duration: 0.42 });
      };

      const showHome = () =&gt; {
        if (!window.gsap || reduceMotion) {
          detail.style.display = &quot;none&quot;;
          home.style.display = &quot;block&quot;;
          return;
        }
        gsap.timeline({ defaults: { ease: &quot;power2.out&quot; } })
          .to(detail, { autoAlpha: 0, y: 12, duration: 0.2 })
          .set(detail, { display: &quot;none&quot; })
          .set(home, { display: &quot;block&quot;, autoAlpha: 0, y: 14 })
          .to(home, { autoAlpha: 1, y: 0, duration: 0.42 });
      };

      root.querySelectorAll(&quot;[data-open-detail]&quot;).forEach((button) =&gt; button.addEventListener(&quot;click&quot;, showDetail));
      root.querySelectorAll(&quot;[data-go-home]&quot;).forEach((button) =&gt; button.addEventListener(&quot;click&quot;, showHome));
      root.querySelectorAll(&quot;[data-scroll-products]&quot;).forEach((button) =&gt; button.addEventListener(&quot;click&quot;, () =&gt; {
        root.querySelector(&quot;#latest-title&quot;)?.scrollIntoView({ behavior: reduceMotion ? &quot;auto&quot; : &quot;smooth&quot;, block: &quot;start&quot; });
      }));

      root.querySelectorAll(&quot;.category-button&quot;).forEach((button) =&gt; {
        button.addEventListener(&quot;click&quot;, () =&gt; {
          const filter = button.dataset.filter;
          root.querySelectorAll(&quot;.category-button&quot;).forEach((item) =&gt; item.setAttribute(&quot;aria-pressed&quot;, String(item === button)));
          const visible = cards.filter((card) =&gt; filter === &quot;all&quot; || card.dataset.category === filter);
          cards.forEach((card) =&gt; card.classList.toggle(&quot;is-filtered&quot;, !visible.includes(card)));
          if (window.gsap &amp;&amp; !reduceMotion) gsap.fromTo(visible, { autoAlpha: 0, y: 10, scale: 0.985 }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.36, stagger: 0.045, ease: &quot;power2.out&quot;, overwrite: true });
        });
      });

      cards.forEach((card) =&gt; {
        const image = card.querySelector(&quot;.product-image&quot;);
        card.addEventListener(&quot;mouseenter&quot;, () =&gt; {
          if (!window.gsap || reduceMotion) return;
          gsap.to(card, { y: -4, duration: 0.28, ease: &quot;power2.out&quot;, overwrite: true });
          gsap.to(image, { scale: 1.035, duration: 0.42, ease: &quot;power2.out&quot;, overwrite: true });
        });
        card.addEventListener(&quot;mouseleave&quot;, () =&gt; {
          if (!window.gsap || reduceMotion) return;
          gsap.to(card, { y: 0, duration: 0.28, ease: &quot;power2.out&quot;, overwrite: true });
          gsap.to(image, { scale: 1.001, duration: 0.42, ease: &quot;power2.out&quot;, overwrite: true });
        });
      });

      const favorite = root.querySelector(&quot;.favorite-action&quot;);
      favorite.addEventListener(&quot;click&quot;, () =&gt; {
        const next = favorite.getAttribute(&quot;aria-pressed&quot;) !== &quot;true&quot;;
        favorite.setAttribute(&quot;aria-pressed&quot;, String(next));
        if (window.gsap &amp;&amp; !reduceMotion) gsap.fromTo(favorite, { scale: 0.96 }, { scale: 1, duration: 0.3, ease: &quot;back.out(2)&quot;, overwrite: true });
      });

      if (window.lucide) lucide.createIcons({ attrs: { width: 16, height: 16, strokeWidth: 1.8 } });

      if (window.gsap) {
        gsap.registerPlugin(window.ScrollTrigger);
        gsap.matchMedia().add({ motion: &quot;(prefers-reduced-motion: no-preference)&quot; }, () =&gt; {
          gsap.timeline({ defaults: { ease: &quot;power3.out&quot; } })
            .from(&quot;#campus-market-concept .market-nav&quot;, { autoAlpha: 0, y: -14, duration: 0.42 })
            .from(&quot;#campus-market-concept .hero-copy &gt; *&quot;, { autoAlpha: 0, y: 18, duration: 0.45, stagger: 0.07 }, &quot;&lt;0.08&quot;)
            .from(&quot;#campus-market-concept .hero-media&quot;, { autoAlpha: 0, scale: 1.04, duration: 0.58 }, &quot;&lt;0.02&quot;);
          gsap.from(&quot;#campus-market-concept .product-card&quot;, {
            autoAlpha: 0,
            y: 22,
            duration: 0.5,
            stagger: 0.055,
            ease: &quot;power2.out&quot;,
            scrollTrigger: { trigger: &quot;#campus-market-concept .product-grid&quot;, start: &quot;top 88%&quot;, once: true }
          });
        }, root);
      }
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
